server.port=8000
spring.application.name=gateway

# Desabilita Spring Security no gateway
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

# ==========================================
# ROTAS — mais específicas PRIMEIRO
# ==========================================

# [0] Read Side — DEVE vir ANTES da rota geral de pedidos
spring.cloud.gateway.routes[0].id=pedidos-read-route
spring.cloud.gateway.routes[0].uri=http://pedidos-api:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/pedidos/read/**

# [1] Write Side — rota geral de pedidos
spring.cloud.gateway.routes[1].id=pedidos-route
spring.cloud.gateway.routes[1].uri=http://pedidos-api:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/pedidos/**

# [2] Catálogo
spring.cloud.gateway.routes[2].id=produtos-route
spring.cloud.gateway.routes[2].uri=http://catalogo-api:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/produtos/**

# [3] Estoques
spring.cloud.gateway.routes[3].id=estoques-route
spring.cloud.gateway.routes[3].uri=http://pedidos-api:8080
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/estoques/**

# [4] Entregas
spring.cloud.gateway.routes[4].id=entregas-route
spring.cloud.gateway.routes[4].uri=http://pedidos-api:8080
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/entregas/**

# [5] Pagamentos
spring.cloud.gateway.routes[5].id=pagamentos-route
spring.cloud.gateway.routes[5].uri=http://pedidos-api:8080
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/pagamentos/**

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always