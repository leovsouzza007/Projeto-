# BANCO DE DADOS - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/loja
spring.datasource.username=postgres
spring.datasource.password=135711
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SWAGGER / OPENAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# SPRING SECURITY
spring.security.user.name=admin
spring.security.user.password=admin

# Actuator - Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.pagamento.sliding-window-size=10
resilience4j.circuitbreaker.instances.pagamento.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pagamento.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.pagamento.permitted-number-of-calls-in-half-open-state=3

# Resilience4j - Retry
resilience4j.retry.instances.pagamento.max-attempts=3
resilience4j.retry.instances.pagamento.wait-duration=500ms